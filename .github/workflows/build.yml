name: build app

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run GaplessPasteCore tests
        run: cd GaplessPasteCore && swift test
      - name: Install tools
        run: brew install xcodegen xcbeautify
      - name: Generate project
        run: xcodegen
      - name: Build app (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project GaplessPaste.xcodeproj -scheme GaplessPaste \
            -configuration Release -destination 'platform=macOS' \
            -derivedDataPath .build/DerivedData \
            CODE_SIGNING_ALLOWED=NO build | xcbeautify
      - name: Package app
        run: |
          ditto -c -k --keepParent \
            .build/DerivedData/Build/Products/Release/GaplessPaste.app \
            "GaplessPaste-${GITHUB_REF_NAME}.zip"
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: GaplessPaste-${{ github.ref_name }}.zip
          generate_release_notes: true
