name: GaplessPaste
options:
  bundleIdPrefix: com.reorx
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

# 第三方依赖统一在 GaplessPasteCore/Package.swift 声明，app target 传递依赖
packages:
  GaplessPasteCore:
    path: GaplessPasteCore

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_HARDENED_RUNTIME: YES

targets:
  GaplessPaste:
    type: application
    platform: macOS
    sources:
      - GaplessPaste
    dependencies:
      - package: GaplessPasteCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reorx.gaplesspaste
        # 资源由 scripts/gen_app_icon.swift 生成（GaplessPaste/Assets.xcassets）
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 本地构建的占位版本；发布时 CI 按 git tag 覆盖（v1.2.3 → 1.2.3），
        # 构建号取 run number（见 .github/workflows/release.yml）
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
    info:
      path: GaplessPaste/Info.plist
      properties:
        CFBundleDisplayName: GaplessPaste
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
    entitlements:
      path: GaplessPaste/GaplessPaste.entitlements
      properties:
        # 非沙箱：app 要启动系统 ssh/scp 子进程、读 ~/.ssh 下的配置与密钥、
        # 在 /tmp 放 ControlMaster socket，都与沙箱不兼容
        com.apple.security.app-sandbox: false
